org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ModDevGradle 在部分 Gradle 版本下配置缓存无法序列化 CreateMinecraftArtifacts，关掉最稳。
org.gradle.configuration-cache=false
# 本机部分仓库地址会被网络层黑洞（连上但无响应），必须设超时否则构建无限挂起。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=120000

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.253
loader_version_range=[4,)

## Mod
mod_id=compactmekanismsun
mod_name=Compact Mekanism Sun
mod_version=0.1.0
mod_group_id=com.compactmekanismsun
mod_license=MIT
mod_authors=khyz
mod_description=Mekanism addon: a single-block Compact Artificial Sun.
mod_url=https://github.com/kevin0337/compact-machine

## Dependencies
# Mekanism 本体（NeoForge 线），10.7.11 起内部 API 才与 1.21.1 这一版一致。
mekanism_version=10.7.19.85
mekanism_version_range=[10.7.11,)
# mekanismsun：上游「人造太阳」附属，本 mod 是它的紧凑化附属。
# 它没有公开 maven 仓库，所以 jar 直接随仓库放在 libs/（相对 mcmod/mekext）。
# 这样 clone 下来不用额外找文件就能构建。
mekanismsun_version=1.3.1
mekanismsun_version_range=[1.3.1,)
mekanismsun_jar=libs/mekanismsun-1.21.1-1.3.1.jar